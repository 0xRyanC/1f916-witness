name: assemble-witness-log
on:
  push:
    paths:
      - '.witness-staging/GO'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Concatenate and verify
        run: |
          set -euo pipefail
          cat countersignatures.jsonl .witness-staging/part_a.jsonl > /tmp/full.jsonl
          BYTES=$(wc -c < /tmp/full.jsonl)
          test "$BYTES" -eq 53138
          echo "3d904187be380188354a86e99bec4cf7201dc1d3dbf066de66f9f7138d116920  /tmp/full.jsonl" | sha256sum -c
          mv /tmp/full.jsonl countersignatures.jsonl
          rm -rf .witness-staging
      - name: Commit
        run: |
          set -euo pipefail
          git config user.name "1f916-witness-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "countersign identity_events=6280 ledger=11 (witness 7)"
          git push
