name: restore-witness
on:
  workflow_dispatch:
  push:
    paths:
      - '_witness_payload.zlib.b64'
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Decode payload into countersignatures.jsonl
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, zlib, pathlib, hashlib
          b64 = pathlib.Path('_witness_payload.zlib.b64').read_text().strip()
          raw = zlib.decompress(base64.b64decode(b64))
          assert len(raw) == 34987, len(raw)
          assert raw.endswith(b'\n')
          text = raw.decode()
          assert '"tree_size":5897' in text
          pathlib.Path('countersignatures.jsonl').write_bytes(raw)
          print('git_blob', hashlib.sha1(b'blob %d\0' % len(raw) + raw).hexdigest())
          PY
          rm -f _witness_payload.zlib.b64
          rm -f .github/workflows/restore-witness.yml
      - name: Commit restored file
        run: |
          set -euo pipefail
          git config user.name 'ryan'
          git config user.email 'rcaviola@gmail.com'
          git add -A
          git commit -m 'witness: countersign identity_events=5897 ledger=8'
          git push
