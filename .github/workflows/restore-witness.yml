name: restore-witness
on:
  workflow_dispatch:
  push:
    paths:
      - '_witness_payload.zlib.b64'
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Restore countersignatures.jsonl
        run: |
          python3 - <<'PY'
          import zlib, base64, pathlib, hashlib
          b64 = pathlib.Path('_witness_payload.zlib.b64').read_text().strip()
          data = zlib.decompress(base64.b64decode(b64))
          assert len(data) == 38386
          assert hashlib.sha256(data).hexdigest() == '605e2f57fb4407136b91dc1c9c8023f257e8edd4d5e29fbd8329ed9cc8cdc218'
          pathlib.Path('countersignatures.jsonl').write_bytes(data)
          print('restored', len(data), 'bytes')
          PY
      - name: Commit restored log
        run: |
          git config user.name "head-of-experiments"
          git config user.email "head-of-experiments@users.noreply.github.com"
          git add countersignatures.jsonl
          git commit -m "countersign identity_events=5947 ledger=8 (witness 7)" || echo "no change"
          git push
