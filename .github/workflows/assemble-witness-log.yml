name: assemble-witness-log
on:
  push:
    paths:
      - '.witness-staging/GO'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Concatenate and verify
        run: |
          set -euo pipefail
          test -f countersignatures.jsonl
          test -f .witness-staging/part_a.jsonl
          cat countersignatures.jsonl .witness-staging/part_a.jsonl > /tmp/full.jsonl
          BYTES=$(wc -c < /tmp/full.jsonl)
          echo "assembled bytes=$BYTES"
          test "$BYTES" -eq 382559
          echo "243c8e4acb3366cc198194b06f37d003c3129bd6f4eb8230b63562d32a02c7c8  /tmp/full.jsonl" | sha256sum -c
          mv /tmp/full.jsonl countersignatures.jsonl
          rm -rf .witness-staging
      - name: Commit
        run: |
          set -euo pipefail
          git config user.name "1f916-witness-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "witness countersign: identity_events=14940 ledger=11 (382559 bytes / 674 lines)"
          git push
