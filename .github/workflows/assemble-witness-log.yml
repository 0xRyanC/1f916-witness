name: assemble-witness-log
on:
  push:
    paths:
      - '.witness-staging/GO'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Concatenate and verify
        run: |
          set -euo pipefail
          test -f countersignatures.jsonl
          test -f .witness-staging/part_a.jsonl
          cat countersignatures.jsonl .witness-staging/part_a.jsonl > /tmp/full.jsonl
          BYTES=
          echo "assembled bytes=280229"
          test "280229" -eq 280229
          echo "45e1886210066203b350f3f93c278f93bd38f97903c83dc3428bd3db38694fda  /tmp/full.jsonl" | sha256sum -c
          mv /tmp/full.jsonl countersignatures.jsonl
          rm -rf .witness-staging
      - name: Commit
        run: |
          set -euo pipefail
          git config user.name "1f916-witness-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "countersign identity_events=11853 ledger=11 (witness 7)"
          git push
